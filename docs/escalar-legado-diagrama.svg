<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1560 600" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, Segoe UI, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/>
    </marker>
    <marker id="arrE" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F7E8A"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4692A"/>
    </marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4457B8"/>
    </marker>
    <style>
      .t{font-size:14px;font-weight:700;fill:#161B22}
      .s{font-size:11px;fill:#5A6577}
      .m{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;fill:#5A6577}
      .mb{font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:700;fill:#161B22}
      .eye{font-family:ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.12em;
        text-transform:uppercase;fill:#8B95A5;font-weight:700}
      .lnk{fill:none;stroke:#5A6577;stroke-width:1.6}
      .dot{fill:none;stroke:#8B95A5;stroke-width:1.4;stroke-dasharray:2 4}
    </style>
  </defs>
  <rect x="0" y="0" width="1560" height="600" fill="#F3F5F8"/>

  <!-- ===== HOJE (pinado) ===== -->
  <text x="250" y="58" text-anchor="middle" class="eye" fill="#B4692A">hoje · pinado (1 caixa)</text>
  <rect x="40" y="72" width="420" height="430" rx="14" fill="#fff" stroke="#B4692A" stroke-width="1.6"/>
  <rect x="70" y="100" width="180" height="50" rx="10" fill="#fff" stroke="#B4692A" stroke-width="2"/>
  <text x="160" y="130" text-anchor="middle" class="mb" fill="#B4692A">pascal-executor</text>
  <path class="lnk" style="stroke:#B4692A" d="M160,150 L160,180" marker-end="url(#arrL)"/>
  <!-- disco local -->
  <rect x="60" y="184" width="380" height="238" rx="12" fill="#FBF6EF" stroke="#B4692A" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="78" y="208" class="m" fill="#B4692A">host · disco LOCAL</text>
  <rect x="80" y="220" width="340" height="44" rx="9" fill="#fff" stroke="#B4692A" stroke-width="1.2"/>
  <text x="98" y="247" class="mb" font-size="12">binários Pascal + oserver</text>
  <rect x="80" y="274" width="340" height="54" rx="9" fill="#FBE7E6" stroke="#C6302B" stroke-width="1.6"/>
  <text x="98" y="296" class="mb" font-size="12" fill="#C6302B">documentos em FileSystem</text>
  <text x="98" y="314" class="s" font-size="11" fill="#C6302B">estado mutável, local → é ISTO que prende</text>
  <rect x="80" y="338" width="340" height="44" rx="9" fill="#fff" stroke="#B4692A" stroke-width="1.2"/>
  <text x="98" y="365" class="mb" font-size="12">ambiente/ · launcherenv.ini</text>
  <text x="78" y="446" class="s">o executor precisa desses arquivos → preso à máquina que os tem.</text>
  <rect x="70" y="462" width="150" height="24" rx="12" fill="#F6ECE0"/>
  <text x="145" y="478" text-anchor="middle" class="m" fill="#B4692A" font-weight="700">1 caixa · não escala</text>

  <!-- ===== O QUE DESTRAVA ===== -->
  <path class="lnk" d="M460,290 L508,290" marker-end="url(#arr)"/>
  <rect x="512" y="150" width="316" height="300" rx="14" fill="#fff" stroke="#0F7E8A" stroke-width="1.6"/>
  <rect x="512" y="150" width="6" height="300" rx="3" fill="#0F7E8A"/>
  <text x="536" y="182" class="t" fill="#0F7E8A">o que destrava</text>
  <g font-size="12.5" fill="#161B22">
    <text x="536" y="214" class="mb" font-size="12.5" fill="#2C7A4B">✓ documentos → S3</text>
    <text x="556" y="231" class="s" font-size="10.5">(ou NFS/EFS) — o legado já suporta S3</text>
    <text x="536" y="262" class="mb" font-size="12.5">✓ binários na imagem / share RO</text>
    <text x="536" y="293" class="mb" font-size="12.5">✓ N instâncias + LB interno</text>
    <text x="536" y="324" class="mb" font-size="12.5">✓ idempotência no gate</text>
    <text x="556" y="341" class="s" font-size="10.5">dedup Redis — p/ retry/escrita (exactly-once)</text>
    <text x="536" y="372" class="mb" font-size="12.5">✓ config de ambiente compartilhada</text>
    <text x="536" y="416" class="s" font-size="11">tira o estado do disco local → o executor</text>
    <text x="536" y="432" class="s" font-size="11">deixa de ser preso a uma máquina.</text>
  </g>
  <path class="lnk" style="stroke:#2C7A4B" d="M828,290 L876,290" marker-end="url(#arrE)"/>

  <!-- ===== DEPOIS (escalável) ===== -->
  <text x="1200" y="58" text-anchor="middle" class="eye" fill="#2C7A4B">depois · escalável 1..N</text>
  <rect x="880" y="72" width="640" height="430" rx="14" fill="#fff" stroke="#2C7A4B" stroke-width="1.6"/>
  <!-- launcher gate note -->
  <rect x="900" y="92" width="600" height="40" rx="10" fill="#E1F0F1" stroke="#0F7E8A" stroke-width="1.3"/>
  <text x="916" y="117" class="m" fill="#0F7E8A">launcher · gate: <tspan font-weight="700">idem:{sessao}:{key}</tspan> → dedup (exactly-once, protege retry/escrita)</text>
  <!-- LB -->
  <rect x="906" y="200" width="86" height="150" rx="10" fill="#EEF1F5" stroke="#5A6577" stroke-width="1.5"/>
  <text x="949" y="272" text-anchor="middle" class="mb" font-size="11">LB</text>
  <text x="949" y="290" text-anchor="middle" class="s" font-size="10">interno</text>
  <!-- executor replicas -->
  <g fill="#fff" stroke="#B4692A">
    <rect x="1020" y="190" width="180" height="48" rx="10" stroke-width="2"/>
    <rect x="1020" y="248" width="180" height="48" rx="10" stroke-width="2"/>
    <rect x="1020" y="306" width="180" height="48" rx="10" stroke-width="1.4" stroke-dasharray="5 4" fill="#FBF6EF"/>
  </g>
  <text x="1110" y="219" text-anchor="middle" class="mb" fill="#B4692A" font-size="12">pascal-executor #1</text>
  <text x="1110" y="277" text-anchor="middle" class="mb" fill="#B4692A" font-size="12">pascal-executor #2</text>
  <text x="1110" y="335" text-anchor="middle" class="m" fill="#B4692A">+N réplicas</text>
  <path class="lnk" style="stroke:#B4692A" d="M992,240 L1016,214" marker-end="url(#arrL)"/>
  <path class="lnk" style="stroke:#B4692A" d="M992,272 L1016,272" marker-end="url(#arrL)"/>
  <path class="lnk" style="stroke:#B4692A" d="M992,304 L1016,330" marker-end="url(#arrL)"/>
  <!-- S3 shared -->
  <g transform="translate(1300,196)">
    <path d="M18,34 a16,16 0 0 1 3,-31 a20,20 0 0 1 38,6 a14,14 0 0 1 -3,25 z" fill="#EAF0F6" stroke="#4B739B" stroke-width="1.5"/>
    <text x="34" y="26" text-anchor="middle" class="mb" font-size="11" fill="#4B739B">S3</text>
  </g>
  <text x="1300" y="252" class="mb" font-size="12" fill="#4B739B">documentos</text>
  <text x="1300" y="269" class="s" font-size="10.5">storage compartilhado</text>
  <rect x="1290" y="286" width="210" height="46" rx="9" fill="#fff" stroke="#4B739B" stroke-width="1.2"/>
  <text x="1302" y="306" class="m" fill="#5A6577">config/ambiente compartilhado</text>
  <text x="1302" y="322" class="m" fill="#5A6577">binários assados na imagem</text>
  <path class="dot" style="stroke:#4B739B" d="M1200,220 C1250,224 1270,222 1288,224"/>
  <path class="dot" style="stroke:#4B739B" d="M1200,278 C1250,262 1270,238 1290,228"/>
  <text x="1200" y="470" text-anchor="middle" class="s">sem estado local → N réplicas atrás do LB, cada uma atende qualquer requisição.</text>
  <rect x="1110" y="482" width="180" height="24" rx="12" fill="#EEF6F1"/>
  <text x="1200" y="498" text-anchor="middle" class="m" fill="#2C7A4B" font-weight="700">escala 1..N</text>

  <!-- bottom note -->
  <text x="40" y="548" class="m" fill="#8B95A5">Estratégico: o pascal-executor é legado em extinção — escalar só compensa se for gargalo agora; senão, migrar o programa pro scci-core rende mais.</text>
  <text x="40" y="566" class="m" fill="#8B95A5">A idempotência (item do gate) vale ligar JÁ, mesmo com 1 réplica: protege contra double-submit/retry e é pré-requisito p/ escalar escrita.</text>
</svg>
