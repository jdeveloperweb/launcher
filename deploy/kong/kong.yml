# =====================================================================
#  Kong DB-less (declarativo). Fluxo:
#    Browser -> Apache -> Kong(PROXY :8000, em Docker) -> gateway-scci(:8083 no HOST)
#
#  IMPORTANTE 1 (upstream): o Kong roda EM CONTAINER, entao "127.0.0.1:8083"
#  apontaria pro proprio container, NAO pro gateway do host -> 502. Por isso o
#  url e "host.docker.internal:8083" (o compose ja mapeia via extra_hosts).
#  Se um dia rodar o Kong NATIVO (nao-docker), troque de volta para 127.0.0.1:8083.
#
#  IMPORTANTE 2 (path): o Apache faz "ProxyPass /aejs-l/rest http://127.0.0.1:8000/"
#  -> remove o /aejs-l/rest e o Kong recebe /w/login, /w/password, /w, /sccidoc.
#  Por isso as rotas abaixo sao esses paths com strip_path=false (repassa como veio).
# =====================================================================
_format_version: "3.0"
_transform: true

services:
  # -------- dominio AUTENTICACAO --------
  - name: autenticacao
    url: http://host.docker.internal:8083
    routes:
      - name: r-login
        paths: [/w/login]
        strip_path: false
        methods: [POST]
        plugins:
          # Anti-brute-force na borda (alem do bloqueio por tentativas do reator): teto por IP no login.
          # (Doc Final de Requisitos: captcha do reator removido -- fora do escopo inicial.)
          - name: rate-limiting
            config: { minute: 20, policy: local, limit_by: ip, hide_client_headers: true }
      - name: r-password
        paths: [/w/password]
        strip_path: false
        methods: [POST]
      - name: r-logout
        paths: [/w/logout]
        strip_path: false
        methods: [POST]
      # r-emailpwd removida: recuperacao automatica de senha por e-mail descontinuada
      # (Doc Final de Requisitos -- fora do escopo inicial). /w/email-pwd nao existe mais no launcher.
      - name: r-valida-acesso
        paths: [/w/valida-acesso]
        strip_path: false
        methods: [POST]

  # -------- dominio DOCUMENTOS (canal de arquivos sccidoc) --------
  - name: documentos
    url: http://host.docker.internal:8083
    routes:
      - name: r-sccidoc
        paths: [/sccidoc]
        strip_path: false
        methods: [POST, GET]   # POST: RDoc/RProc + upload multipart; GET: AbrirUrl view/download path-based

  # -------- dominio EXECUCAO (despacho /w) --------
  # Prefixo mais curto: o Kong prioriza o path mais longo, entao /w/login e
  # /w/password acima ganham; o resto de /w cai aqui.
  - name: execucao
    url: http://host.docker.internal:8083
    routes:
      - name: r-dispatch
        paths: [/w]
        strip_path: false
        methods: [POST, GET]   # GET: combos/stores do ExtJS (ledados via querystring) — sem isto davam 404

  # -------- SCAFFOLD (novos bounded contexts) — 501 hoje --------
  # - name: licencas
  #   url: http://127.0.0.1:8083
  #   routes: [{ name: r-licencas, paths: [/licencas], strip_path: false }]
  # - name: documentos
  #   url: http://127.0.0.1:8083
  #   routes: [{ name: r-documentos, paths: [/documentos], strip_path: false }]

plugins:
  # Rate limiting GLOBAL na borda (teto de vazao por IP). Politica 'local' (1 no de Kong); trocar
  # para 'redis' quando houver mais de um no. Nao afeta o teto mais estrito do /w/login.
  - name: rate-limiting
    config: { minute: 300, policy: local, limit_by: ip, hide_client_headers: true }
  # Correlation-id: casa com o X-Request-Id do RequestIdFilter (observabilidade ponta a ponta).
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
  # OpenTelemetry: exporta os spans da borda (Kong) para o Collector -> X-Ray Service Map.
  # Requer no container kong:  -e KONG_TRACING_INSTRUMENTATIONS=all -e KONG_TRACING_SAMPLING_RATE=1.0
  - name: opentelemetry
    config:
      endpoint: http://host.docker.internal:4318/v1/traces   # collector no HOST (Kong em Docker); non-blocking
      resource_attributes:
        service.name: kong
