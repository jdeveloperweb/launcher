# =====================================================================
#  OpenTelemetry / ADOT Collector — pipeline de métricas do reator.
#
#  Reator (Micrometer OTLP push) ─→ receiver OTLP ─→ transform(OTTL) ─→ Prometheus + debug
#  Kong (plugin opentelemetry, futuro) usa o MESMO receiver.
#
#  O processor `transform` usa a DSL OTTL (OpenTelemetry Transformation Language) — é onde você
#  "desenha" as métricas em RUNTIME, declarativamente. Editar aqui + recarregar o Collector muda a
#  telemetria SEM redeploy do app. Rodar: ver deploy-hex/observability/subir-collector.sh
# =====================================================================
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s

  # ---- OTTL: a "DSL dinâmica" de métricas (hot-editável) ----
  transform:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          # marca a camada de origem (reator) — atributo derivado em runtime
          - set(attributes["camada"], "reator") where attributes["camada"] == nil
          # extrai o DOMINIO a partir da rota /w/login|/w/password|/w (bounded context)
          - set(attributes["dominio"], "autenticacao") where IsMatch(attributes["uri"], "/w/(login|password)")
          - set(attributes["dominio"], "execucao")     where attributes["uri"] == "/w"
          # >> edite as regras acima e recarregue o Collector — sem redeploy do reator <<

exporters:
  # Expoe as metricas para o Prometheus raspar (e para curl de validacao)
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true
  # Log detalhado no stdout do Collector (docker logs) — util p/ validar o fluxo (metricas + traces)
  debug:
    verbosity: normal

  # ================== AWS (PRONTO — habilitar ao ter a credencial) ==================
  # Requer no container otel-hex:  -e AWS_REGION=<regiao> -e AWS_ACCESS_KEY_ID=... -e AWS_SECRET_ACCESS_KEY=...
  # (ou IAM Roles Anywhere) + egress HTTPS/443 para *.amazonaws.com. Depois descomente abaixo
  # e adicione os exporters nas pipelines (linhas marcadas).  IAM minimo:
  #   logs:PutLogEvents/CreateLogGroup/CreateLogStream  (CloudWatch EMF)  +  xray:PutTraceSegments/PutTelemetryRecords
  # awsemf:                        # CloudWatch (metricas via Embedded Metric Format)
  #   region: ${env:AWS_REGION}
  #   namespace: LauncherHex
  #   log_group_name: /launcher-hex/metrics
  # awsxray:                       # X-Ray (traces -> Service Map)
  #   region: ${env:AWS_REGION}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [transform, batch]
      exporters: [prometheus, debug]      # AWS: acrescente  awsemf
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]                  # AWS: acrescente  awsxray
  telemetry:
    logs:
      level: info
