# ============================================================================
#  Os trilhos Java/Pascal do Strangler (README) via Docker: gateway-scci (:8083),
#  scci-core PURO (:8092), scci-core HIBRIDO (:8090), launcher (:8091) + Redis.
#  (o Configurador e o Kong nao estao aqui — sobem a parte.)
#
#  REDE (importante): gateway, scci-core (puro/hibrido) e launcher rodam em `network_mode: host`.
#  Motivo: o launcherenv.ini de cada cliente aponta o Postgres p/ DB_HOSTNAME=localhost (= o HOST),
#  e esses 3 servicos LEEM o .ini E CONECTAM no banco (login, SCCI_SESSION). Dentro de um container
#  bridge, localhost seria o proprio container -> falha. Com host network, localhost = o host, e os
#  servicos se enxergam entre si por localhost:porta. So o Redis fica em bridge (publicado em :6379,
#  alcancado por localhost). O Kong (em container, sobe a parte) chega no gateway por host.docker.internal:8083.
#
#  Os Dockerfiles compilam o jar A PARTIR DO FONTE (multi-stage) — NAO precisa de
#  `mvn package` antes. O `context: ../..` aponta pra RAIZ do monorepo (parent pom +
#  modulos), que o build precisa; cada servico usa seu `dockerfile:`.
#
#  Uso:
#    cp .env.example .env               # ajuste os paths do Pascal legado (hibrido/launcher)
#    DOCKER_BUILDKIT=1 docker compose --env-file .env build
#    docker compose --env-file .env up -d
#
#  scci-core-hibrido e launcher so executam Pascal DE VERDADE se os volumes abaixo
#  apontarem pra caixa legada real (binfpc + ambientes). Sem isso, sobem e passam no
#  health check, mas chamadas que dependam do Pascal falham (sem o binario).
# ============================================================================
name: scci

networks:
  scci-net:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: scci-redis
    networks: [scci-net]
    ports:
      - "6379:6379"
    restart: unless-stopped

  scci-core-puro:
    build:
      context: ../..
      dockerfile: scci-core/bootstrap/Dockerfile
    image: scci-core:local
    container_name: scci-core-puro
    # REDE DO HOST: o launcherenv aponta o Postgres p/ localhost (= o HOST). Com host network o
    # container enxerga Postgres e Redis do host em localhost, SEM tocar no launcherenv (que e
    # compartilhado com o Pascal legado). Incompativel com networks/ports/extra_hosts: a porta
    # vem do SERVER_PORT e o processo bind direto no host.
    network_mode: host
    depends_on: [redis]
    environment:
      SERVER_PORT: 8092
      SCCI_SDK: "false"
      REDIS_HOST: localhost        # redis publicado no host:6379
      REDIS_PORT: 6379
      OTLP_METRICS_URL: ${OTLP_METRICS_URL:-http://127.0.0.1:4318/v1/metrics}
      OTLP_TRACES_URL: ${OTLP_TRACES_URL:-http://127.0.0.1:4318/v1/traces}
    volumes:
      # RAIZ(ES) dos ambientes — o ambiente chega por PARAMETRO, entao monta o PARENT (nao um cliente).
      - ${AMBIENTES_ROOT:-/home}:${AMBIENTES_ROOT:-/home}:ro
      # - /u10:/u10:ro
      # - /u11:/u11:ro
    restart: unless-stopped

  scci-core-hibrido:
    build:
      context: ../..
      dockerfile: scci-core/bootstrap/Dockerfile
    image: scci-core:local            # mesma imagem do puro (muda so o SCCI_SDK)
    container_name: scci-core-hibrido
    # REDE DO HOST (mesmo motivo do puro): launcherenv aponta o Postgres p/ localhost = o HOST.
    # Sem isso o /interno/acesso/login da 500 (Connection refused ao banco). Incompativel com
    # networks/ports/extra_hosts. Os volumes (filesystem) continuam funcionando normalmente.
    network_mode: host
    depends_on: [redis]
    environment:
      SERVER_PORT: 8090
      SCCI_SDK: "true"
      EXECUTOR_TRANSPORTE: uds
      EXECUTOR_SHIM: /u/scci/binfpc/oserver-shim
      REDIS_HOST: localhost        # redis publicado no host:6379
      REDIS_PORT: 6379
      OTLP_METRICS_URL: ${OTLP_METRICS_URL:-http://127.0.0.1:4318/v1/metrics}
      OTLP_TRACES_URL: ${OTLP_TRACES_URL:-http://127.0.0.1:4318/v1/traces}
    volumes:
      - ${PASCAL_BINFPC_HOST_PATH:-/u/scci/binfpc}:/u/scci/binfpc:ro
      - ${PASCAL_AMBIENTES_HOST_PATH:-/u/scci/ambientes}:/u/scci/ambientes:ro
      # RAIZ(ES) dos ambientes dos clientes. O ambiente chega por PARAMETRO no request (ex.:
      # /home/c6bank/dados/pg/dados), entao o container precisa enxergar QUALQUER path possivel:
      # monta o PARENT, nao um cliente. Ajuste AMBIENTES_ROOT no .env; adicione outros roots se houver.
      - ${AMBIENTES_ROOT:-/home}:${AMBIENTES_ROOT:-/home}:ro
      # - /u10:/u10:ro
      # - /u11:/u11:ro
    restart: unless-stopped

  launcher:
    build:
      context: ../..
      dockerfile: launcher/Dockerfile
    image: launcher:local
    container_name: scci-launcher
    # REDE DO HOST: executa Pascal contra o ambiente do cliente (launcherenv + Postgres localhost).
    network_mode: host
    environment:
      SERVER_PORT: 8091
      EXECUTOR_TRANSPORTE: uds
      EXECUTOR_SHIM: /u/scci/binfpc/oserver-shim
      OTLP_METRICS_URL: ${OTLP_METRICS_URL:-http://127.0.0.1:4318/v1/metrics}
      OTLP_TRACES_URL: ${OTLP_TRACES_URL:-http://127.0.0.1:4318/v1/traces}
    volumes:
      - ${PASCAL_BINFPC_HOST_PATH:-/u/scci/binfpc}:/u/scci/binfpc:ro
      - ${PASCAL_AMBIENTES_HOST_PATH:-/u/scci/ambientes}:/u/scci/ambientes:ro
      # RAIZ dos ambientes dos clientes (o Pascal le o launcherenv do path que vem no request).
      - ${AMBIENTES_ROOT:-/home}:${AMBIENTES_ROOT:-/home}:ro
    restart: unless-stopped

  gateway-scci:
    build:
      context: ../..
      dockerfile: gateway-scci/bootstrap/Dockerfile
    image: gateway-scci:local
    container_name: scci-gateway
    # REDE DO HOST: o gateway TAMBEM toca o ambiente do cliente — le o launcherenv.ini E grava/valida a
    # SCCI_SESSION no Postgres (DB_HOSTNAME=localhost), o store autoritativo que o launcher.pas revalida.
    # Sem host network o /w/login estoura ao registrar a sessao (NoSuchFile no .ini + banco inalcancavel).
    network_mode: host
    depends_on: [redis, scci-core-puro, scci-core-hibrido]
    environment:
      SERVER_PORT: 8083
      REDIS_HOST: localhost        # redis publicado no host:6379
      REDIS_PORT: 6379
      # roteamento dos 3 trilhos — todos na rede do host, entao localhost.
      GATEWAY_HIBRIDO_URL: http://localhost:8090
      GATEWAY_PURO_URL: http://localhost:8092
      GATEWAY_EXECUTOR_URL: http://localhost:8090
      # URL do scci-core p/ os módulos Java (acesso/login, documentos, sessão).
      LAUNCHER_SCCI_CORE_URL: http://localhost:8090
      # URL do launcher (executor Pascal) p/ o log-evento (sccilog)
      LAUNCHER_PASCAL_EXECUTOR_URL: http://localhost:8091
      OTLP_METRICS_URL: ${OTLP_METRICS_URL:-http://127.0.0.1:4318/v1/metrics}
      OTLP_TRACES_URL: ${OTLP_TRACES_URL:-http://127.0.0.1:4318/v1/traces}
    volumes:
      # o gateway le o launcherenv.ini do ambiente (SCCI_SESSION) — mesma RAIZ dos scci-core.
      - ${AMBIENTES_ROOT:-/home}:${AMBIENTES_ROOT:-/home}:ro
      # - /u10:/u10:ro
      # - /u11:/u11:ro
    restart: unless-stopped
