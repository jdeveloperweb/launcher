server:
  port: 8090          # REST interno do scci-core (o launcher chama; NAO exposto ao front)

spring:
  application:
    name: scci-core

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

# Config dos contextos (banco/redis/etc.) entra nas fases de migracao.
